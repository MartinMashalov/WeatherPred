name: Engineering checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check weatherpred tests research/experiments research/probes
      - run: uv run ruff format --check weatherpred tests research/experiments research/probes
      - run: uv run pytest -q
