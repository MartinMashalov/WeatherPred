[project]
name = "weatherpred"
version = "0.1.0"
description = "Point-in-time Kalshi weather research and shadow execution"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "numpy>=2,<3", "scipy>=1.15,<2", "pandas>=2.2,<3", "pypdf>=5,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
weatherpred = "weatherpred.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
